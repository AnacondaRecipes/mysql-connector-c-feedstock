{% set name = "mysql-connector-c" %}
{% set version = "8.0.29" %}
{% set sha256 = "9a6236a28bca33ae951d8ccaabb8ff51a188863e8599f9096f4ae0a1da19f87f" %}  # [not win]
{% set sha256 = "c1e4f1d0e6528d6327aa60490fa139c1421c76c2efbe0655a56fbe8f3e0117d7" %}  # [win]

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz  # [not win]
  fn: {{ name }}-{{ version }}.zip  # [win]
  url: https://dev.mysql.com/get/Downloads/Connector-C++/mysql-connector-c++-{{ version }}-src.tar.gz  # [not win]
  url: https://dev.mysql.com/get/Downloads/Connector-C++/mysql-connector-c++-{{ version }}-src.zip  # [win]
  sha256: {{ sha256 }}
  #patches:
    #- 0001-Add-definition-for-lldiv_t.patch  # [win and vc<14]
    #- 0001-CPPFLAGS-can-have-more-than-one-compiler-definition.patch
    #- 0002-GCC-7-Fix-empty-string-comparison-error.patch
    # Copied from https://gitweb.gentoo.org/repo/gentoo.git/tree/dev-db/mysql-connector-c/files/6.1.11-openssl-1.1.patch
    #- 0003-Don-t-use-deprecated-API-with-openssl-1.1.patch  # [unix]

build:
  number: 1
  run_exports:
    # https://abi-laboratory.pro/tracker/timeline/mysql-connector-c/
    # Scary symbol removal between patch versions
    - {{ pin_subpackage('mysql-connector-c', max_pin='x.x.x.x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - make        # [unix]
    - patch       # [not win]
    - m2-patch    # [win]
  host:
    - openssl     # [not win]
    - msinttypes  # [win and vc<14]

test:
  commands:
    - mysql_config --version  # [not win]
    - my_print_defaults --version

about:
  home: https://dev.mysql.com/downloads/connector/c/
  license: LGPL
  license_family: LGPL
  license_file: COPYING
  summary: 'MySQL Connector/C, the C interface for communicating with MySQL servers.'
  description: |
    Connector/C is a client library that implements the C API for
    client/server communication. It is a standalone replacement for
    the MySQL client library shipped with MySQL Server distributions.

extra:
  recipe-maintainers:
    - druvus
